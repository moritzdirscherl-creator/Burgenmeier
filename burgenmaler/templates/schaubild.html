<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ – Schaubild</title>
<style>
  :root {
    --paper: #f3ead6; --ink: #3b2a1a; --muted: #7a6650; --panel: rgba(243, 234, 214, 0.92);
    --line: #cdbb98; --accent: #8a4b2a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #221c16; --ink: #efe3cc; --muted: #b9a78c; --panel: rgba(34, 28, 22, 0.9);
      --line: #4d4033; --accent: #e09a6a;
    }
  }
  :root[data-theme="dark"] {
    --paper: #221c16; --ink: #efe3cc; --muted: #b9a78c; --panel: rgba(34, 28, 22, 0.9);
    --line: #4d4033; --accent: #e09a6a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c8d3d8; color: var(--ink);
    font: 14px/1.4 Georgia, "Times New Roman", serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { position: fixed; top: 12px; left: 12px; width: 310px; max-width: calc(100% - 24px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  h1 { font-size: 19px; margin: 0 0 2px; font-weight: normal; }
  .sub { color: var(--muted); font-style: italic; margin-bottom: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .lbl { color: var(--muted); font-size: 12px; width: 100%; margin-bottom: -2px; }
  button { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 5px; padding: 4px 9px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  .legend { display: none; margin-top: 6px; }
  .legend.on { display: block; }
  .legend div { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); }
  #info { position: fixed; right: 12px; bottom: 12px; width: 320px; max-width: calc(100% - 24px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: none; }
  #info h2 { font-size: 16px; margin: 0 0 4px; font-weight: normal; }
  #info .k { color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  #toggle { display: none; }
  #wait { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #3b2a1a; font-style: italic; pointer-events: none; }
  body.clean .panel, body.clean #info, body.clean #wait { display: none !important; }
  @media (max-width: 600px) {
    .panel { top: auto; bottom: 12px; left: 16px; right: 16px; width: auto; max-width: none; }
    .panel.collapsed .body { display: none; }
    #toggle { display: inline-block; float: right; }
    #info { top: 12px; bottom: auto; left: 16px; right: 16px; width: auto; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="wait">Schaubild wird gemalt …</div>
<div class="panel" id="panel">
  <button id="toggle" aria-label="Bedienfeld ein-/ausklappen">☰</button>
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>
  <div class="body">
    <div class="row" id="views">
      <button data-view="vogelschau">Vogelschau</button>
      <button data-view="sued">Süd</button>
      <button data-view="west">West</button>
      <button data-view="nord">Nord</button>
      <button data-view="ost">Ost</button>
      <button data-view="grundriss">Grundriss</button>
      <button data-view="umgebung">Umgebung</button>
    </div>
    <div class="row" id="lights">
      <span class="lbl">Licht</span>
      <button data-light="morgen">Morgen</button>
      <button data-light="mittag">Mittag</button>
      <button data-light="abend">Abend</button>
    </div>
    <div class="row">
      <button id="befund" aria-pressed="false">Befundlage</button>
      <button id="env" aria-pressed="true">Umgebung zeigen</button>
      <button id="shot">Bild speichern</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="hint">Schaubild: Oberflächen, Bewuchs und Licht sind illustrativ. Belegt ist nur, was die
      Befundlage zeigt.<br>Ziehen: drehen · Rechts/Shift-Ziehen: verschieben · Mausrad/Pinch: zoomen · Klick: Bauteil-Info</div>
  </div>
</div>
<div id="info"></div>

<script id="scene" type="application/json">__SCENE_JSON__</script>
__THREE_SCRIPT__
<script>
(function () {
  'use strict';
  const S = JSON.parse(document.getElementById('scene').textContent);
  const Q = new URLSearchParams(location.search);
  if (Q.get('clean')) document.body.classList.add('clean');
  const meta = S.meta;
  document.getElementById('title').textContent = meta.name;
  document.getElementById('subtitle').textContent = 'Schaubild' +
    (meta.date ? ', Zustand um ' + meta.date : '') + ' · Oberflächen illustrativ';

  // ---------------------------------------------------------------------------
  // Hilfen
  // ---------------------------------------------------------------------------
  const toGL = (x, y, z) => [x, z, -y];
  const col = h => new THREE.Color(h).convertSRGBToLinear();
  function rng(seed) {
    let s = seed >>> 0 || 1;
    return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }
  function hash2(x, y) {
    let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, oct) {
    let s = 0, a = 0.5, f = 1;
    for (let k = 0; k < (oct || 4); k++) { s += a * vnoise(x * f + k * 17.3, y * f - k * 9.1); f *= 2.03; a *= 0.5; }
    return s / (1 - Math.pow(0.5, oct || 4));
  }
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
  const canvas = renderer.domElement;
  const maxTex = renderer.capabilities.maxTextureSize;
  const small = Math.min(screen.width, screen.height) < 700 && !Q.get('clean');
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  const aniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  // ---------------------------------------------------------------------------
  // Prozedurale Texturen (im Browser gemalt, kachelbar)
  // ---------------------------------------------------------------------------
  function canvasTex(size, paint, opts) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    paint(g, size);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = aniso;
    if (!(opts && opts.linear)) t.encoding = THREE.sRGBEncoding;
    return t;
  }
  function speckle(g, N, r, amt, seed) {
    const R = rng(seed), img = g.getImageData(0, 0, N, N), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const p = i / 4, x = p % N, y = (p / N) | 0;
      const n = (R() - 0.5) * amt + (fbm(x / r, y / r, 3) - 0.5) * amt * 1.6;
      d[i] = Math.max(0, Math.min(255, d[i] * (1 + n)));
      d[i + 1] = Math.max(0, Math.min(255, d[i + 1] * (1 + n)));
      d[i + 2] = Math.max(0, Math.min(255, d[i + 2] * (1 + n)));
    }
    g.putImageData(img, 0, 0);
  }
  // Steine in Reihen (Bruchstein/Quader, Ziegel, Schiefer, Schindel): wrap-fähig
  function courses(g, N, o) {
    const R = rng(o.seed);
    g.fillStyle = o.joint; g.fillRect(0, 0, N, N);
    const rows = [];
    let y = 0;
    while (y < N) { const h = o.rowH[0] + R() * (o.rowH[1] - o.rowH[0]); rows.push(h); y += h; }
    const k = N / y;
    y = 0;
    rows.forEach((h0, ri) => {
      const h = h0 * k;
      let x = o.stagger ? (ri % 2) * o.w[0] * 0.5 : -R() * o.w[1];
      while (x < N) {
        const w = o.w[0] + R() * (o.w[1] - o.w[0]);
        const v = o.shade(R);
        for (const ox of [0, -N, N]) o.draw(g, x + ox, y, w, h, v, R);
        x += w;
      }
      y += h;
    });
  }
  function rgb(v, tint) { return 'rgb(' + (v * tint[0] | 0) + ',' + (v * tint[1] | 0) + ',' + (v * tint[2] | 0) + ')'; }
  function roundRect(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.fill();
  }
  const TEX = {};
  const texSize = small ? 256 : 512;
  function makeTextures() {
    const N = texSize, s = N / 512;
    TEX.masonry = canvasTex(N, (g) => { // lagerhaftes Bruchsteinmauerwerk, Kachel 4 m
      courses(g, N, { seed: 11, joint: '#9c9382', rowH: [30 * s, 72 * s], w: [48 * s, 170 * s],
        shade: R => 165 + R() * 75,
        draw: (g, x, y, w, h, v, R) => {
          const t = [1 + (R() - 0.4) * 0.1, 1, 1 - (R() - 0.3) * 0.12];
          const j = () => (R() - 0.5) * 7 * s, m = 3 * s;
          g.fillStyle = rgb(v, t); g.beginPath();
          g.moveTo(x + m + j(), y + m + j()); g.lineTo(x + w * 0.5 + j(), y + m * 0.6 + j());
          g.lineTo(x + w - m + j(), y + m + j()); g.lineTo(x + w - m * 0.6 + j(), y + h * 0.5 + j());
          g.lineTo(x + w - m + j(), y + h - m + j()); g.lineTo(x + w * 0.5 + j(), y + h - m * 0.6 + j());
          g.lineTo(x + m + j(), y + h - m + j()); g.lineTo(x + m * 0.6 + j(), y + h * 0.5 + j()); g.fill();
          const gr = g.createLinearGradient(0, y, 0, y + h);
          gr.addColorStop(0, 'rgba(255,255,255,0.12)'); gr.addColorStop(0.6, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.16)');
          g.fillStyle = gr; g.fill();
        } });
      speckle(g, N, 12 * s, 0.2, 5);
    });
    TEX.brick = canvasTex(N, (g) => {
      courses(g, N, { seed: 21, joint: '#b9ae9c', rowH: [17 * s, 17 * s], w: [62 * s, 66 * s], stagger: true,
        shade: R => 170 + R() * 70,
        draw: (g, x, y, w, h, v, R) => { g.fillStyle = rgb(v, [1, 0.97, 0.94]); g.fillRect(x + 1.5 * s, y + 1.5 * s, w - 3 * s, h - 3 * s); } });
      speckle(g, N, 6 * s, 0.12, 7);
    });
    TEX.plaster = canvasTex(N, (g) => {
      g.fillStyle = '#ece6da'; g.fillRect(0, 0, N, N); speckle(g, N, 40 * s, 0.10, 9);
    });
    TEX.timber = canvasTex(N, (g) => { // Fachwerk: 4,8 m breit, 3 m hoch je Kachel
      g.fillStyle = '#efe8da'; g.fillRect(0, 0, N, N); speckle(g, N, 30 * s, 0.08, 13);
      const bw = 22 * s, dark = '#4a3424';
      g.strokeStyle = dark; g.fillStyle = dark; g.lineWidth = bw * 0.9;
      for (const x of [0, N / 3, 2 * N / 3]) g.fillRect(x - bw / 2, 0, bw, N);
      g.fillRect(N - bw / 2, 0, bw, N);
      g.fillRect(0, N - bw, N, bw); g.fillRect(0, 0, N, bw * 0.8); g.fillRect(0, N * 0.47, N, bw * 0.8);
      g.beginPath();
      g.moveTo(N / 3, N * 0.47); g.lineTo(0, N - bw); g.moveTo(2 * N / 3, N * 0.47); g.lineTo(N, N - bw);
      g.moveTo(N / 3, bw); g.lineTo(2 * N / 3, N * 0.47);
      g.stroke();
      speckle(g, N, 5 * s, 0.10, 14);
    });
    TEX.wood = canvasTex(N, (g) => {
      courses(g, N, { seed: 31, joint: '#3d2e22', rowH: [512 * s, 512 * s], w: [44 * s, 70 * s],
        shade: R => 150 + R() * 70,
        draw: (g, x, y, w, h, v) => { g.fillStyle = rgb(v, [1, 0.92, 0.82]); g.fillRect(x + 2 * s, y, w - 4 * s, h); } });
      g.globalAlpha = 0.25; const R = rng(4);
      for (let k = 0; k < 400; k++) { g.fillStyle = R() < 0.5 ? '#2a1d12' : '#e8d8c0'; g.fillRect(R() * N, R() * N, 1.2 * s, 30 * s + R() * 90 * s); }
      g.globalAlpha = 1;
    });
    TEX.tile = canvasTex(N, (g) => { // Biberschwanz, Kachel 2 m
      courses(g, N, { seed: 41, joint: '#5a2a1e', rowH: [40 * s, 40 * s], w: [44 * s, 48 * s], stagger: true,
        shade: R => 165 + R() * 80,
        draw: (g, x, y, w, h, v, R) => {
          const t = [1, 0.92 + R() * 0.08, 0.88 + R() * 0.1];
          const gr = g.createLinearGradient(0, y, 0, y + h);
          gr.addColorStop(0, rgb(v * 0.72, t)); gr.addColorStop(1, rgb(v, t));
          g.fillStyle = gr; g.beginPath();
          g.moveTo(x + 2 * s, y); g.lineTo(x + w - 2 * s, y); g.lineTo(x + w - 2 * s, y + h * 0.7);
          g.quadraticCurveTo(x + w / 2, y + h * 1.25, x + 2 * s, y + h * 0.7); g.fill();
        } });
      speckle(g, N, 7 * s, 0.14, 15);
    });
    TEX.slate = canvasTex(N, (g) => {
      courses(g, N, { seed: 51, joint: '#2b2f35', rowH: [28 * s, 34 * s], w: [34 * s, 62 * s], stagger: true,
        shade: R => 150 + R() * 90,
        draw: (g, x, y, w, h, v, R) => {
          g.fillStyle = rgb(v, [0.96, 1, 1.04 + R() * 0.04]);
          g.beginPath(); g.moveTo(x + 1.5 * s, y); g.lineTo(x + w - 1.5 * s, y); g.lineTo(x + w - 1.5 * s, y + h * 0.75);
          g.lineTo(x + w * 0.35, y + h - 1.5 * s); g.lineTo(x + 1.5 * s, y + h * 0.8); g.fill();
        } });
      speckle(g, N, 6 * s, 0.12, 16);
    });
    TEX.shingle = canvasTex(N, (g) => {
      courses(g, N, { seed: 61, joint: '#2e2218', rowH: [34 * s, 38 * s], w: [18 * s, 40 * s], stagger: false,
        shade: R => 140 + R() * 90,
        draw: (g, x, y, w, h, v, R) => {
          g.fillStyle = rgb(v, [1, 0.9, 0.78]); g.fillRect(x + 1 * s, y, w - 2 * s, h - 2 * s);
          g.fillStyle = 'rgba(0,0,0,0.18)';
          for (let k = 0; k < 3; k++) g.fillRect(x + R() * w, y, 1 * s, h);
        } });
      speckle(g, N, 5 * s, 0.12, 17);
    });
    TEX.thatch = canvasTex(N, (g) => {
      g.fillStyle = '#b8a46a'; g.fillRect(0, 0, N, N);
      const R = rng(71);
      for (let k = 0; k < 9000 * s * s; k++) {
        const x = R() * N, y = R() * N, l = (20 + R() * 50) * s, v = 120 + R() * 120;
        g.strokeStyle = 'rgba(' + (v | 0) + ',' + (v * 0.88 | 0) + ',' + (v * 0.55 | 0) + ',0.5)';
        g.lineWidth = (0.8 + R()) * s; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (R() - 0.5) * 4 * s, y + l); g.stroke();
        if (y + l > N) { g.beginPath(); g.moveTo(x, y - N); g.lineTo(x, y + l - N); g.stroke(); }
      }
      g.fillStyle = 'rgba(40,30,10,0.18)';
      for (let y = 0; y < N; y += N / 5) g.fillRect(0, y, N, 6 * s);
    });
    TEX.lead = canvasTex(N, (g) => {
      g.fillStyle = '#c8ccd0'; g.fillRect(0, 0, N, N); speckle(g, N, 30 * s, 0.08, 18);
      g.fillStyle = 'rgba(40,45,50,0.35)'; for (let x = 0; x < N; x += N / 4) g.fillRect(x, 0, 3 * s, N);
    });
    // Wellen-Normalmap fürs Wasser
    TEX.waves = canvasTex(256, (g, N) => {
      const img = g.createImageData(N, N), d = img.data;
      const h = (x, y) => fbm(x / 22, y / 22, 4) + 0.4 * fbm(x / 7 + 40, y / 7, 2);
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        const hx = h((x + 1) % N, y) - h((x + N - 1) % N, y), hy = h(x, (y + 1) % N) - h(x, (y + N - 1) % N);
        const nx = -hx * 3, ny = -hy * 3, nz = 1, L = Math.hypot(nx, ny, nz), i = (y * N + x) * 4;
        d[i] = (nx / L * 0.5 + 0.5) * 255; d[i + 1] = (ny / L * 0.5 + 0.5) * 255; d[i + 2] = (nz / L * 0.5 + 0.5) * 255; d[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
    }, { linear: true });
  }

  // Werkstoff -> (Textur, Kachelgröße u × v in m, Helligkeitsausgleich, Relief)
  const SURF = {
    stone: ['masonry', 4, 4, 1.25, 1], stone_dark: ['masonry', 4, 4, 1.25, 1], sandstone: ['masonry', 4, 4, 1.2, 1],
    red_sandstone: ['masonry', 4, 4, 1.25, 1], brick: ['brick', 2, 2, 1.25, 0.6], plaster: ['plaster', 6, 6, 1.06, 0.2],
    timber: ['timber', 4.8, 3, 1.08, 0.3], wood: ['wood', 3, 3, 1.25, 0.6],
    slate: ['slate', 2, 2, 1.3, 0.7], tile: ['tile', 2, 2, 1.3, 0.8], shingle: ['shingle', 2, 2, 1.35, 0.7],
    thatch: ['thatch', 3, 3, 1.3, 1], lead: ['lead', 2.4, 2.4, 1.1, 0.2],
  };
  function surfaceFor(p) {
    if (p.m && SURF[p.m]) return SURF[p.m];
    if (p.r === 'roof') return SURF.tile;
    if (p.r === 'bridge') return SURF.wood;
    return SURF.stone;
  }

  // ---------------------------------------------------------------------------
  // Gelände: geglättet, verfeinert, nach Neigung und Nutzung eingefärbt
  // ---------------------------------------------------------------------------
  const ext = S.terrain.extent, T = S.terrain, n = T.res + 1, dx = ext / T.res, e = ext / 2;
  const Hg = (i, j) => T.h[Math.max(0, Math.min(n - 1, j)) * n + Math.max(0, Math.min(n - 1, i))];
  function cr(p0, p1, p2, p3, t) {
    return p1 + 0.5 * t * (p2 - p0 + t * (2 * p0 - 5 * p1 + 4 * p2 - p3 + t * (3 * (p1 - p2) + p3 - p0)));
  }
  // bikubisch zwischen den Gitterpunkten, exakt auf ihnen
  function heightAt(x, y) {
    const fx = (x + e) / dx, fy = (y + e) / dx, i = Math.floor(fx), j = Math.floor(fy), tx = fx - i, ty = fy - j;
    const r = [];
    for (let k = -1; k <= 2; k++) r.push(cr(Hg(i - 1, j + k), Hg(i, j + k), Hg(i + 1, j + k), Hg(i + 2, j + k), tx));
    return cr(r[0], r[1], r[2], r[3], ty);
  }
  const names = T.names, pal = T.palette.map(col);
  const kindIdx = Object.fromEntries(names.map((k, i) => [k, i]));
  const cellAt = (ci, cj) => T.cells[Math.max(0, Math.min(T.res - 1, cj)) * T.res + Math.max(0, Math.min(T.res - 1, ci))];
  const ROCK = '#8f897d';

  // ---------------------------------------------------------------------------
  // Bodenkarte: Nutzung aus den Vektordaten der castle.json gemalt (≈ 0,2 m je Pixel)
  // statt aus dem 10-m-Zellraster – Wege, Feldstreifen und Ränder bleiben scharf.
  // ---------------------------------------------------------------------------
  const V = S.vec || { env: {}, plateau: null, ditches: [] };
  const GS = Math.min(small ? 2048 : 4096, maxTex), pxm = GS / ext;   // Pixel je Meter
  const PX = (x, y) => [(x + e) * pxm, (e - y) * pxm];
  function chaikin(pts, closed, it) {
    let p = pts.map(q => [q[0], q[1]]);
    for (let k = 0; k < (it || 3); k++) {
      const out = closed ? [] : [p[0]];
      const m = closed ? p.length : p.length - 1;

        const v = I[t * 3 + s], x = V[v * 3], y = V[v * 3 + 1], z = V[v * 3 + 2], o9 = t * 9 + s * 3;
        pos.set(toGL(x, y, z), o9);
        let sx = 0, sy = 0, sz = 0;
        for (const t2 of byKey.get(keyOf(v))) {
          const f2 = fn[t2];
          if (f2[0] * nx + f2[1] * ny + f2[2] * nz >= cosT) { sx += f2[0] * f2[3]; sy += f2[1] * f2[3]; sz += f2[2] * f2[3]; }
        }
        const sl = Math.hypot(sx, sy, sz) || 1;
        nor.set(toGL(sx / sl, sy / sl, sz / sl), o9);
        uv[t * 6 + s * 2] = (x * tx + y * ty) / su;
        uv[t * 6 + s * 2 + 1] = (tl < 1e-3 ? y : (x * bx + y * by + z * bz) - (Math.abs(nz) < 0.2 ? base : 0)) / sv;
        // Verschattung am Mauerfuß, leichte Farbstreuung je Baukörper
        const root = comp(v);
        if (!tint.has(root)) tint.set(root, 0.9 + 0.2 * hash2(root * 7 + 3, (o.id || '').length * 13));
        let ao = tint.get(root);
        if (p.r !== 'roof') ao *= 0.6 + 0.4 * smooth(-0.3, 3.0, z - heightAt(x, y));
        cl[o9] = cl[o9 + 1] = cl[o9 + 2] = ao;
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    g.setAttribute('color', new THREE.BufferAttribute(cl, 3));
    return g;
  }

  // ---------------------------------------------------------------------------
  // Bäume: unregelmäßige Kronen in Varianten, Farbstreuung je Baum
  // ---------------------------------------------------------------------------
  function blobGeometry(spheres, seed) {
    const out = { p: [], n: [], c: [] };
    spheres.forEach(([cx, cy, cz, r, ry], si) => {
      const g = new THREE.IcosahedronGeometry(1, 2), P = g.attributes.position;
      const fnN = new THREE.Vector3();
      for (let k = 0; k < P.count; k += 3) {
        const tri = [0, 1, 2].map(s => {
          const v = new THREE.Vector3().fromBufferAttribute(P, k + s);
          const d = 1 + (fbm(v.x * 1.7 + seed + si * 5, v.y * 1.7 + v.z * 1.3, 3) - 0.5) * 0.55;
          return { dir: v.clone(), p: new THREE.Vector3(v.x * r * d + cx, v.y * (ry || r) * d + cy, v.z * r * d + cz) };
        });
        fnN.subVectors(tri[1].p, tri[0].p).cross(new THREE.Vector3().subVectors(tri[2].p, tri[0].p)).normalize();
        for (const t of tri) {
          const nn = t.dir.clone().multiplyScalar(0.7).addScaledVector(fnN, 0.3).normalize();
          out.p.push(t.p.x, t.p.y, t.p.z); out.n.push(nn.x, nn.y, nn.z);
          const a = 0.55 + 0.45 * smooth(-1, 0.9, t.dir.y); out.c.push(a, a, a);
        }
      }
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(out.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(out.n, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(out.c, 3));
    return g;
  }
  function firGeometry(tiers) {
    const parts = [];
    for (let k = 0; k < tiers; k++) {
      const r = 2.6 * (1 - k * 0.24), h = 4.6 - k * 0.6, y0 = 1.6 + k * 2.4;
      const g = new THREE.ConeGeometry(r, h, 8, 1, true).translate(0, y0 + h / 2, 0);
      const cc = [], P = g.attributes.position;
      for (let i = 0; i < P.count; i++) { const a = 0.55 + 0.45 * smooth(y0, y0 + h, P.getY(i)); cc.push(a, a, a); }
      g.setAttribute('color', new THREE.Float32BufferAttribute(cc, 3));
      parts.push(g.toNonIndexed ? (g.index ? g.toNonIndexed() : g) : g);
    }
    const p = [], nn = [], c = [];
    for (const g of parts) { p.push(...g.attributes.position.array); nn.push(...g.attributes.normal.array); c.push(...g.attributes.color.array); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nn, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
    return g;
  }

  // ---------------------------------------------------------------------------
  // Himmel, Licht, Umgebungslicht
  // ---------------------------------------------------------------------------
  const LIGHTS = {
    morgen: { az: 105, el: 18, sun: '#ffd9a8', int: 2.0, zen: '#7fa3c7', hor: '#e8dccb', hemi: 0.3 },
    mittag: { az: 200, el: 52, sun: '#fff6e8', int: 2.3, zen: '#6d97c4', hor: '#dfe6e6', hemi: 0.35 },
    abend: { az: 290, el: 24, sun: '#ffcf96', int: 2.1, zen: '#7194bd', hor: '#e6d8c6', hemi: 0.3 },
    // Standard: Licht von Nordwesten wie in den Zeichnungen des Burgenmeisters
    zeichnung: { az: 315, el: 40, sun: '#fff1dc', int: 2.2, zen: '#7a9fc6', hor: '#e8e2d4', hemi: 0.35 },
  };
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 1, ext * 12);
  const skyU = { zen: { value: new THREE.Color() }, hor: { value: new THREE.Color() },
    sunDir: { value: new THREE.Vector3() }, sunCol: { value: new THREE.Color() } };
  const skyMat = new THREE.ShaderMaterial({
    uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,

    fragmentShader: [

      'void main(){ vec3 d = normalize(vDir); float h = max(d.y, 0.0);',
      ' vec3 c = mix(hor, zen, pow(h, 0.55));',

      ' c += sunCol * (pow(s, 12.0) * 0.25 + pow(s, 400.0) * 3.0);',
      ' if (d.y < 0.0) c = hor * 0.92;',

  const bb = S.bbox;
  const center = new THREE.Vector3(...toGL((bb[0][0] + bb[1][0]) / 2, (bb[0][1] + bb[1][1]) / 2, (bb[0][2] + bb[1][2]) / 2));
  const radius = Math.max(bb[1][0] - bb[0][0], bb[1][1] - bb[0][1]) / 2 + 25;

  function setLight(name) {
    const L = LIGHTS[name] || LIGHTS.zeichnung;
    const A = L.az * Math.PI / 180, E = L.el * Math.PI / 180;
    const d = new THREE.Vector3(Math.sin(A) * Math.cos(E), Math.sin(E), -Math.cos(A) * Math.cos(E));
    const half = e * 1.05; // ganzer Ausschnitt, damit auch Hügel und Wald Schatten werfen
    sun.color.set(L.sun); sun.intensity = L.int;
    sun.position.copy(center).addScaledVector(d, ext * 1.5); sun.target.position.copy(center);
    const sc = sun.shadow.camera;
    sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.near = 1; sc.far = ext * 3.5;
    sc.updateProjectionMatrix();
    skyU.zen.value.set(L.zen).convertSRGBToLinear(); skyU.hor.value.set(L.hor).convertSRGBToLinear();
    skyU.sunDir.value.copy(d); skyU.sunCol.value.set(L.sun).convertSRGBToLinear();
    scene.fog.color.copy(skyU.hor.value).lerp(skyU.zen.value, 0.3); // Luftperspektive: Ferne leicht bläulich

    const skyScene = new THREE.Scene(); skyScene.add(new THREE.Mesh(sky.geometry, skyMat));

    current.light = name;
  }

  // ---------------------------------------------------------------------------
  // Szene aufbauen
  // ---------------------------------------------------------------------------
  const pickables = [], envGroup = new THREE.Group(), burgGroup = new THREE.Group(), allMeshes = [], waterMats = [];
  const current = { light: 'zeichnung' };
  function build() {
    makeTextures();
    const tGeo = buildTerrain();
    const groundTex = new THREE.CanvasTexture(groundCanvas);
    groundTex.encoding = THREE.sRGBEncoding; groundTex.anisotropy = aniso;
    const terrain = new THREE.Mesh(tGeo, new THREE.MeshStandardMaterial({
      color: new THREE.Color(0.8, 0.8, 0.8), vertexColors: true, map: groundTex, roughness: 0.97, envMapIntensity: 0.3 }));
    terrain.receiveShadow = true; terrain.castShadow = true;  // Hänge verschatten einander

      vertexColors: true, roughness: 1, envMapIntensity: 0.3 }));
    skirt.receiveShadow = true; skirt.castShadow = true;
    scene.add(skirt, envGroup, burgGroup);

    for (const o of S.objects) {
      for (const p of o.parts) {
        const water = p.r === 'water';
        let mesh;
        if (water) {
          const pos = [];
          for (let k = 0; k < p.p.length; k += 3) pos.push(...toGL(p.p[k], p.p[k + 1], p.p[k + 2]));
          const g = new THREE.BufferGeometry();

          const uv = []; for (let k = 0; k < p.p.length; k += 3) uv.push(p.p[k] / 30, p.p[k + 1] / 30);
          g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
          g.setIndex(p.i); g.computeVertexNormals();
          const m = new THREE.MeshStandardMaterial({ color: col('#3f5f66'), roughness: 0.08, metalness: 0.1,
            normalMap: TEX.waves, normalScale: new THREE.Vector2(0.35, 0.35), envMapIntensity: 1.3,
            transparent: true, opacity: 0.88, side: THREE.DoubleSide });
          waterMats.push(m);
          mesh = new THREE.Mesh(g, m);
          mesh.receiveShadow = true;
        } else {
          const surf = surfaceFor(p);
          const isOpen = p.r === 'opening';
          const tex = isOpen ? null : TEX[surf[0]];
          const base = col(p.c).multiplyScalar(isOpen ? 1 : surf[3]);
          const m = new THREE.MeshStandardMaterial({ color: base.clone(), map: tex, bumpMap: tex,
            bumpScale: 0.04 * (surf[4] || 0), vertexColors: true, roughness: p.r === 'roof' ? 0.82 : 0.93,
            envMapIntensity: 0.45 });
          mesh = new THREE.Mesh(buildPart(p, o), m);
          mesh.castShadow = true; mesh.receiveShadow = true;
          mesh.userData = { obj: o, base, role: p.r };
          pickables.push(mesh);
        }
        mesh.userData.obj = o; mesh.userData.role = p.r;
        (o.layer === 'burg' ? burgGroup : envGroup).add(mesh);
        allMeshes.push(mesh);
      }
    }

    // Bäume
    const variants = {
      laub: [blobGeometry([[0, 5.3, 0, 3.3, 3.2]], 1),
             blobGeometry([[-1.1, 4.8, 0.4, 2.4, 2.3], [1.2, 5.2, -0.3, 2.5, 2.5], [0, 6.6, 0.2, 2.3, 2.1]], 2),
             blobGeometry([[0, 4.6, 0, 2.9, 2.4], [0.4, 6.4, 0.3, 2.1, 1.9]], 3)],
      nadel: [firGeometry(3), firGeometry(4)],
    };
    const trunkG = new THREE.CylinderGeometry(0.22, 0.38, 3.4, 6).translate(0, 1.3, 0);
    const byVariant = {}, allTrees = S.trees.concat(extraTrees);
    allTrees.forEach(t => {
      const kind = t[3] === 'nadel' ? 'nadel' : 'laub';
      const v = Math.floor(hash2(t[0] * 10, t[1] * 10) * variants[kind].length);
      (byVariant[kind + v] = byVariant[kind + v] || { g: variants[kind][v], kind, list: [] }).list.push(t);
    });
    const mtx = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0), cc = new THREE.Color();
    const place = (t, k, im, colorize) => {
      const h = hash2(t[0] * 7, t[1] * 3), sy = t[4] * (0.9 + 0.25 * h);
      q.setFromAxisAngle(up, h * 6.283);
      const inside = Math.abs(t[0]) < e && Math.abs(t[1]) < e;
      mtx.compose(new THREE.Vector3(...toGL(t[0], t[1], (inside ? heightAt(t[0], t[1]) : t[2]) - 0.2)), q, new THREE.Vector3(t[4], sy, t[4]));
      im.setMatrixAt(k, mtx);
      if (colorize) {
        cc.set(S.treeColors[t[3] === 'nadel' ? 'nadel' : 'laub']).convertSRGBToLinear();
        const hsl = {}; cc.getHSL(hsl);
        cc.setHSL(hsl.h + (hash2(t[1] * 5, t[0] * 9) - 0.5) * 0.06, hsl.s * (0.85 + 0.3 * h), hsl.l * (0.8 + 0.45 * hash2(t[0] * 3, t[1] * 11)));
        im.setColorAt(k, cc);
      }
    };
    for (const key in byVariant) {
      const { g, list } = byVariant[key];
      const im = new THREE.InstancedMesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, envMapIntensity: 0.3 }), list.length);
      list.forEach((t, k) => place(t, k, im, true));
      im.castShadow = true; im.receiveShadow = true;
      envGroup.add(im);
    }
    if (allTrees.length) {
      const im = new THREE.InstancedMesh(trunkG, new THREE.MeshStandardMaterial({ color: col(S.treeColors.stamm), roughness: 1 }), allTrees.length);
      allTrees.forEach((t, k) => place(t, k, im, false));
      im.castShadow = true;
      envGroup.add(im);
    }
  }

  // ---------------------------------------------------------------------------
  // Kamera (Orbit) – gleiche Ansichten wie im Burgenmeister
  // ---------------------------------------------------------------------------
  const st = { target: center.clone(), az: 150, el: 32, dist: radius * 3.4 };
  function applyCam() {
    const A = st.az * Math.PI / 180, E = st.el * Math.PI / 180;
    const d = [Math.sin(A) * Math.cos(E), Math.cos(A) * Math.cos(E), Math.sin(E)];
    camera.position.set(st.target.x + d[0] * st.dist, st.target.y + d[2] * st.dist, st.target.z - d[1] * st.dist);
    if (st.el > 89) camera.up.set(-Math.sin(A), 0, Math.cos(A)); else camera.up.set(0, 1, 0);
    camera.lookAt(st.target);
    // Dunst mit dem Abstand mitführen: nah klar, die Ferne verblasst
    scene.fog.near = st.dist * 0.9 + ext * 0.25; scene.fog.far = st.dist * 1.2 + ext * 3.2;
    // Kamera nie unter das Gelände
    const gx = camera.position.x, gy = -camera.position.z;
    if (Math.abs(gx) < e && Math.abs(gy) < e) {
      const g = heightAt(gx, gy) + 2;
      if (camera.position.y < g) { camera.position.y = g; camera.lookAt(st.target); }
    }
  }
  const VIEWS = {
    vogelschau: { az: 150, el: 32, f: 3.4 }, sued: { az: 180, el: 9, f: 3.6 }, nord: { az: 0, el: 9, f: 3.6 },
    ost: { az: 90, el: 9, f: 3.6 }, west: { az: 270, el: 9, f: 3.6 }, grundriss: { az: 180, el: 89.9, f: 3.6 },
    umgebung: { az: 160, el: 28, f: 0, all: true },
  };
  function setView(name) {
    const v = VIEWS[name];
    if (!v) return;
    st.az = v.az; st.el = v.el;
    st.target.copy(center);
    st.dist = v.all ? ext * 1.25 : radius * v.f;
    applyCam();
  }
  // freie Kamera: az/el in Grad, dist in m, target [x, y, z] lokal (x Ost, y Nord, z oben)
  function setCamera(c) {
    if (c.az != null) st.az = c.az;
    if (c.el != null) st.el = c.el;
    if (c.dist != null) st.dist = c.dist;
    if (c.target) st.target.set(...toGL(c.target[0], c.target[1], c.target[2] != null ? c.target[2] : heightAt(c.target[0], c.target[1])));
    if (c.fov) { camera.fov = c.fov; camera.updateProjectionMatrix(); }
    applyCam();
  }
  let drag = null;
  canvas.addEventListener('contextmenu', ev => ev.preventDefault());
  canvas.addEventListener('pointerdown', ev => {
    canvas.setPointerCapture(ev.pointerId);
    drag = { x: ev.clientX, y: ev.clientY, pan: ev.button === 2 || ev.shiftKey, moved: 0, id: ev.pointerId };
  });
  canvas.addEventListener('pointermove', ev => {
    if (!drag || drag.id !== ev.pointerId || pointers.size > 1) return;
    const dxp = ev.clientX - drag.x, dyp = ev.clientY - drag.y;
    drag.x = ev.clientX; drag.y = ev.clientY; drag.moved += Math.abs(dxp) + Math.abs(dyp);
    if (drag.pan) {
      const s = st.dist * 0.0014;
      const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
      const fwd = new THREE.Vector3().subVectors(st.target, camera.position).setY(0).normalize();
      st.target.addScaledVector(right, -dxp * s).addScaledVector(fwd, dyp * s);
    } else {
      st.az = (st.az - dxp * 0.35 + 360) % 360;
      st.el = Math.max(2, Math.min(89.9, st.el + dyp * 0.25));
    }
    applyCam();
  });
  canvas.addEventListener('pointerup', ev => {
    if (drag && drag.moved < 4) pick(ev);
    drag = null;
  });
  canvas.addEventListener('wheel', ev => {
    ev.preventDefault();
    st.dist = Math.max(15, Math.min(ext * 3, st.dist * Math.exp(ev.deltaY * 0.001)));
    applyCam();
  }, { passive: false });
  const pointers = new Map(); let pinch0 = null;
  canvas.addEventListener('pointerdown', ev => pointers.set(ev.pointerId, ev));
  canvas.addEventListener('pointermove', ev => {
    if (!pointers.has(ev.pointerId)) return;
    pointers.set(ev.pointerId, ev);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      if (pinch0) { st.dist = Math.max(15, Math.min(ext * 3, st.dist * pinch0 / d)); applyCam(); }
      pinch0 = d;
    }
  });
  const endP = ev => { pointers.delete(ev.pointerId); if (pointers.size < 2) pinch0 = null; };
  canvas.addEventListener('pointerup', endP); canvas.addEventListener('pointercancel', endP);

  // ---------------------------------------------------------------------------
  // Auswahl / Info / Schalter
  // ---------------------------------------------------------------------------
  const ray = new THREE.Raycaster(), info = document.getElementById('info');
  const confLabel = { gesichert: 'gesichert', wahrscheinlich: 'wahrscheinlich', analogie: 'nach Analogie', annahme: 'Annahme' };
  const srcById = Object.fromEntries((meta.sources || []).map(s => [s.id, s]));
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function pick(ev) {
    const r = canvas.getBoundingClientRect();
    ray.setFromCamera({ x: (ev.clientX - r.left) / r.width * 2 - 1, y: -(ev.clientY - r.top) / r.height * 2 + 1 }, camera);
    const hit = ray.intersectObjects(pickables.filter(m => m.visible && m.parent.visible))[0];
    if (!hit) { info.style.display = 'none'; return; }
    const o = hit.object.userData.obj;
    const src = (o.sources || []).map(id => {
      const s = srcById[id];
      return '<li>' + esc(id) + (s ? ': ' + esc(s.title) + (s.year ? ' (' + esc(s.year) + ')' : '') : '') + '</li>';
    }).join('');
    info.innerHTML = '<h2>' + esc(o.name) + '</h2>' +
      '<div><span class="k">Befund:</span> <span style="color:' + S.confColors[o.confidence] + '">■</span> ' + esc(confLabel[o.confidence]) + '</div>' +
      (o.phase ? '<div><span class="k">Bauphase:</span> ' + esc(o.phase) + '</div>' : '') +
      (o.note ? '<div style="margin-top:4px">' + esc(o.note) + '</div>' : '') +
      (src ? '<div class="k" style="margin-top:6px">Quellen</div><ul style="margin:2px 0 0;padding-left:18px">' + src + '</ul>'
           : '<div class="k" style="margin-top:6px">Keine Quelle angegeben</div>') +
      '<div class="k" style="margin-top:6px;font-size:12px">Mauerwerk, Deckung und Farben im Schaubild sind illustrativ.</div>';
    info.style.display = 'block';
  }
  const befundBtn = document.getElementById('befund'), legend = document.getElementById('legend');
  legend.innerHTML = Object.entries(S.confColors).map(([k, c]) =>
    '<div><span class="sw" style="background:' + c + '"></span>' + confLabel[k] + '</div>').join('');
  function setBefund(on) {
    befundBtn.setAttribute('aria-pressed', on);
    legend.classList.toggle('on', on);
    for (const m of allMeshes) {
      const u = m.userData;
      if (u.obj.layer !== 'burg' || u.role === 'water') continue;
      m.material.color.copy(on ? col(S.confColors[u.obj.confidence]).multiplyScalar(1.15) : u.base);
    }
  }
  befundBtn.onclick = () => setBefund(befundBtn.getAttribute('aria-pressed') !== 'true');
  const envBtn = document.getElementById('env');
  function setEnv(on) { envBtn.setAttribute('aria-pressed', on); envGroup.visible = on; }
  envBtn.onclick = () => setEnv(envBtn.getAttribute('aria-pressed') !== 'true');
  document.getElementById('views').addEventListener('click', ev => {

  document.getElementById('shot').onclick = () => {
    renderer.render(scene, camera);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = (meta.name || 'burg').replace(/[^\wäöüÄÖÜß-]+/g, '_') + '_schaubild.png';
    a.click();
  };
  const panel = document.getElementById('panel');
  document.getElementById('toggle').onclick = () => panel.classList.toggle('collapsed');

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // erst malen lassen, dann rechnen, damit der Hinweis sichtbar ist
  requestAnimationFrame(() => setTimeout(() => {
    build();
    resize();
    setLight(Q.get('licht') || 'zeichnung');
    setView(Q.get('ansicht') || 'vogelschau');
    document.getElementById('wait').remove();
    const t0 = performance.now();
    // ?clean=1 (Bildexport): kein Dauerlauf, gerendert wird nur auf Anforderung
    if (!Q.get('clean')) (function loop() {
      const t = (performance.now() - t0) / 1000;
      for (const m of waterMats) m.normalMap.offset.set(t * 0.004, t * 0.0025);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    })();
    window.__burgenmaler = { setView, setCamera, setLight, setBefund, setEnv, st, ready: true,
      groundMap: () => groundCanvas.toDataURL('image/jpeg', 0.9),
      render: () => renderer.render(scene, camera),
      snapshot: () => { renderer.render(scene, camera); return canvas.toDataURL('image/png'); } };
  }, 30));
})();
</script>
</body>
</html>
